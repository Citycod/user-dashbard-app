<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PalmPay Transfer | CityTopUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-bottom: 100px; /* space for fixed bottom nav */
    }
    .navbar-brand {
      font-weight: bold;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #fff;
      border-top: 1px solid #ddd;
      z-index: 1000;
    }
    .bottom-nav .nav-link {
      padding: 10px;
      font-size: 14px;
      color: #555;
    }
    .bottom-nav .nav-link.active {
      color: #0d6efd;
    }
  </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-light bg-white shadow-sm px-3 sticky-top">
  <div class="container-fluid">
    <a href="dashboard.html" class="back-arrow">
      <i class="bi bi-arrow-left"></i>
    </a>
    <span class="navbar-brand text-primary">
      <i class="bi bi-bank2 me-2"></i>CityTopUp
    </span>
    <div>
      <i class="bi bi-person-circle fs-4 text-secondary"></i>
    </div>
  </div>
</nav>

<!-- Transfer Form -->
<div class="container mt-4">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h5 class="card-title mb-3">Transfer to PalmPay</h5>

      <div id="successMessage" class="alert alert-success d-none" role="alert">
        ✅ Transfer successful!
      </div>

      <!-- Recipient -->
      <div class="mb-3">
        <label for="recipient" class="form-label">PalmPay Account Number</label>
        <input type="text" class="form-control" id="recipient" placeholder="Enter account number">
      </div>

      <!-- Amount -->
      <div class="mb-3">
        <label for="amount" class="form-label">Amount (₦)</label>
        <input type="number" class="form-control" id="amount" placeholder="Enter amount">
      </div>

      <!-- Description -->
      <div class="mb-3">
        <label for="description" class="form-label">Description (optional)</label>
        <textarea class="form-control" id="description" rows="2" placeholder="Note to recipient"></textarea>
      </div>

      <!-- Transfer Button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary py-3 fw-semibold" id="transferBtn">
          <i class="bi bi-send-check me-2"></i>Send to PalmPay
        </button>
      </div>
    </div>

    
  </div>
  <hr class="my-4">

  <h6 class="text-muted">Recent Transactions</h6>
  <div class="recent-transactions list-group">
    <div class="list-group-item d-flex justify-content-between">
      <div>
        <strong>PalmPay</strong><br>
        7048760133 - John Doe
      </div>
      <span class="text-success">₦500,000</span>
    </div>
    <div class="list-group-item d-flex justify-content-between">
      <div>
        <strong>PalmPay</strong><br>
        8029818691 - Jane Smith
      </div>
      <span class="text-success">₦2,000,000</span>
    </div>
    <!-- Add more dummy recent transactions -->
  </div>
</div>
</div>



<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('transferBtn').addEventListener('click', function() {
    const recipient = document.getElementById('recipient').value.trim();
    const amount = document.getElementById('amount').value.trim();
    const successMessage = document.getElementById('successMessage');

    if (recipient && amount > 0) {
      successMessage.classList.remove('d-none');
      setTimeout(() => {
        successMessage.classList.add('d-none');
        document.getElementById('recipient').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('description').value = '';
      }, 3000);
    } else {
      alert('Please enter a valid account number and amount.');
    }
  });
</script>

</body>
</html>
